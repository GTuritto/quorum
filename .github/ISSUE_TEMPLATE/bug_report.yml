name: Bug report
description: Report reproducible Quorum skill or installer behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials or security vulnerabilities here. Use the private reporting instructions in SECURITY.md for security issues.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skill protocol
        - Interactive selector
        - Installation engine
        - Codex
        - Claude Code
        - Antigravity
        - VS Code
        - Cursor
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Quorum version
      placeholder: 0.1.57
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, terminal, Node.js version, and target assistant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant output with secrets removed.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
