name: Publish npm package

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm CLI that supports trusted publishing
        run: npm install --global npm@^11.15.0

      - name: Verify release version and main ancestry
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/verify-release.mjs

      - run: npm test

      - run: npm run dist

      - uses: actions/upload-artifact@v6
        with:
          name: quorum-skill-${{ steps.release.outputs.version }}
          path: |
            dist/quorum-skill-${{ steps.release.outputs.version }}.tgz
            dist/quorum-skill-${{ steps.release.outputs.version }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Publish through npm trusted publishing
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm publish "./dist/quorum-skill-${RELEASE_VERSION}.tgz" --access public
