<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img"><title>How Quorum Full works</title><desc>One task and its constraints go to isolated candidates. Anonymous proposals go to a fresh reviewer. The coordinator synthesizes a recommendation with evidence, uncertainty and important objections. Three candidates and one reviewer illustrate the default Full panel.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F83"/></marker></defs><rect x="0" y="0" width="1600" height="1130" rx="0" fill="#F5F8FA" stroke="#F5F8FA" stroke-width="2"/><text x="70" y="80" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#087F83">HOW QUORUM FULL WORKS</text><text x="70" y="142" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" fill="#142C3B">Independent attempts. A reviewed recommendation.</text><text x="70" y="194" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#526574">Illustrated with three candidates and one fresh reviewer</text><rect x="390" y="245" width="820" height="106" rx="18" fill="white" stroke="#B7C9D5" stroke-width="2"/><text x="423" y="288" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#142C3B">The task, evidence and constraints</text><text x="423" y="326" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#526574">Each candidate receives the necessary context</text><path d="M 800 351 L 280 417" fill="none" stroke="#087F83" stroke-width="4" marker-end="url(#arrow)"/><rect x="70" y="435" width="420" height="115" rx="18" fill="white" stroke="#B7C9D5" stroke-width="2"/><text x="98" y="480" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#156CC1">Candidate A</text><text x="98" y="520" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#526574">Develops a proposal in isolation</text><path d="M 800 351 L 800 417" fill="none" stroke="#087F83" stroke-width="4" marker-end="url(#arrow)"/><rect x="590" y="435" width="420" height="115" rx="18" fill="white" stroke="#B7C9D5" stroke-width="2"/><text x="618" y="480" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#156CC1">Candidate B</text><text x="618" y="520" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#526574">Develops a proposal in isolation</text><path d="M 800 351 L 1320 417" fill="none" stroke="#087F83" stroke-width="4" marker-end="url(#arrow)"/><rect x="1110" y="435" width="420" height="115" rx="18" fill="white" stroke="#B7C9D5" stroke-width="2"/><text x="1138" y="480" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#156CC1">Candidate C</text><text x="1138" y="520" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#526574">Develops a proposal in isolation</text><path d="M 280 550 L 800 658" fill="none" stroke="#087F83" stroke-width="4" marker-end="url(#arrow)"/><path d="M 800 550 L 800 658" fill="none" stroke="#087F83" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1320 550 L 800 658" fill="none" stroke="#087F83" stroke-width="4" marker-end="url(#arrow)"/><rect x="390" y="675" width="820" height="126" rx="18" fill="#E9F5F3" stroke="#70B7B4" stroke-width="2"/><text x="425" y="720" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#087F83">Anonymize proposals → independent review</text><text x="425" y="762" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#526574">A fresh reviewer challenges claims and assumptions</text><path d="M 800 801 L 800 844" fill="none" stroke="#087F83" stroke-width="4" marker-end="url(#arrow)"/><rect x="390" y="860" width="820" height="125" rx="18" fill="white" stroke="#B7C9D5" stroke-width="2"/><text x="425" y="907" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#142C3B">Coordinator synthesis</text><text x="425" y="952" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#526574">Recommendation + reasons + uncertainty + dissent</text><text x="70" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#526574">Available when the host supports isolated workers. Panel size can vary.</text><text x="70" y="1082" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#526574">Agreement is not proof. Check consequential findings against evidence.</text></svg>