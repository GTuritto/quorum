<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>From a council service to a skill</title><desc>Original idea: assistant connects through MCP to a separately operated council. Quorum places the review protocol inside the existing assistant; Full uses host delegation where available.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F83"/></marker></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F8FA" stroke="#F5F8FA" stroke-width="2"/><text x="70" y="80" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#087F83">FROM A COUNCIL SERVICE TO A SKILL</text><text x="70" y="142" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#142C3B">Bring the process into the assistant</text><text x="70" y="194" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#526574">The design choice behind Quorum</text><rect x="70" y="240" width="1460" height="250" rx="18" fill="white" stroke="#B7C9D5" stroke-width="2"/><text x="105" y="290" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#526574">ORIGINAL IDEA</text><rect x="110" y="325" width="350" height="110" rx="18" fill="white" stroke="#B7C9D5" stroke-width="2"/><text x="132" y="369" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#142C3B">AI assistant</text><text x="132" y="409" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526574">Your existing workspace</text><rect x="555" y="325" width="270" height="110" rx="18" fill="white" stroke="#B7C9D5" stroke-width="2"/><text x="577" y="369" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#142C3B">MCP connection</text><text x="577" y="409" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526574">Calls the service</text><rect x="920" y="325" width="565" height="110" rx="18" fill="white" stroke="#B7C9D5" stroke-width="2"/><text x="942" y="369" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#142C3B">Council service</text><text x="942" y="409" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526574">Operated locally or hosted elsewhere</text><path d="M 470 380 L 537 380" fill="none" stroke="#087F83" stroke-width="4" marker-end="url(#arrow)"/><path d="M 835 380 L 902 380" fill="none" stroke="#087F83" stroke-width="4" marker-end="url(#arrow)"/><rect x="70" y="535" width="1460" height="350" rx="18" fill="#E9F5F3" stroke="#70B7B4" stroke-width="2"/><text x="105" y="585" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#087F83">QUORUM</text><rect x="110" y="615" width="1375" height="220" rx="18" fill="white" stroke="#70B7B4" stroke-width="2"/><text x="140" y="658" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142C3B">Your existing AI assistant</text><rect x="140" y="692" width="310" height="110" rx="18" fill="#F5F8FA" stroke="#B7C9D5" stroke-width="2"/><text x="160" y="732" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#142C3B">Task + context</text><text x="160" y="772" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526574">Goals and constraints</text><rect x="525" y="692" width="430" height="110" rx="18" fill="#F5F8FA" stroke="#B7C9D5" stroke-width="2"/><text x="545" y="732" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#142C3B">Quorum skill</text><text x="545" y="772" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526574">Proposals → review → synthesis</text><rect x="1030" y="692" width="420" height="110" rx="18" fill="#F5F8FA" stroke="#B7C9D5" stroke-width="2"/><text x="1050" y="732" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#142C3B">Recommendation</text><text x="1050" y="772" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526574">Reasons and open objections</text><path d="M 460 747 L 508 747" fill="none" stroke="#087F83" stroke-width="4" marker-end="url(#arrow)"/><path d="M 965 747 L 1012 747" fill="none" stroke="#087F83" stroke-width="4" marker-end="url(#arrow)"/><text x="70" y="935" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#526574">No separate council service. Full review depends on the host’s delegation capabilities.</text></svg>